# Nom du workflow, affiché dans l'onglet Actions et sur les PR
name: CI

# Événements qui déclenchent le workflow
on:
  pull_request:              # à chaque PR : on vérifie le code avant de le fusionner
  push:
    branches: [main]         # après chaque push sur main : on revérifie

# Deux jobs, sans "needs" : ils tournent en parallèle
jobs:

  # ---------- Job 1 : vérification du frontend ----------
  front:
    runs-on: ubuntu-latest                     # machine Linux fournie par GitHub
    defaults:
      run: { working-directory: starter/front }
                                               # toutes les commandes "run" s'exécutent dans starter/front/
    steps:
      - uses: actions/checkout@v4              # télécharge le dépôt sur le runner (sinon il est vide)
      - uses: actions/setup-node@v4            # installe Node.js sur le runner
        with: { node-version: 20, cache: npm, cache-dependency-path: starter/front/package-lock.json }
                                               # Node 20 + cache des dépendances npm,
                                               # calculé à partir du package-lock.json du front
      - run: npm ci                            # installe les dépendances exactement comme dans package-lock.json
      - run: npm run lint && npm run format:check
                                               # ESLint (qualité du code), puis Prettier (formatage)
                                               # le && stoppe tout si le lint échoue
      - run: npm test                          # lance les tests du front
      - run: npm run build                     # construit la version finale du front

  # ---------- Job 2 : vérification de l'API ----------
  api:
    runs-on: ubuntu-latest                     # un runner séparé, indépendant de celui du front
    defaults:
      run: { working-directory: starter/api }  # commandes exécutées dans starter/api/
    steps:
      - uses: actions/checkout@v4              # chaque job repart d'une machine vide : il faut refaire le checkout
      - uses: actions/setup-node@v4            # idem : Node doit être réinstallé pour ce job
        with: { node-version: 20, cache: npm, cache-dependency-path: starter/api/package-lock.json }
      - run: npm ci                            # dépendances de l'API
      - run: npm run lint && npm run format:check
                                               # mêmes vérifications que pour le front
      - run: npm test                          # tests de l'API (pas de build ici)